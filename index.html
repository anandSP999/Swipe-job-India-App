<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swipe Jobs India - App Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0A192F;
            --card-bg: #112240;
            --primary-accent: #00E676; /* Vibrant Green */
            --secondary-accent: #0066FF; /* Vibrant Blue */
            --text-main: #E6F1FF;
            --text-muted: #8892B0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo span { color: var(--primary-accent); }

        .search-bar {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            width: 300px;
            color: white;
            outline: none;
        }

        /* Views */
        .view-section { display: none; padding: 40px 5%; animation: fadeIn 0.4s ease-in; }
        .view-section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hero Section */
        .hero {
            text-align: center;
            margin-bottom: 50px;
        }
        .hero h1 { font-size: 40px; margin-bottom: 15px; }
        .hero p { color: var(--text-muted); font-size: 18px; }

        /* App Grid */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .app-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 230, 118, 0.1);
        }

        .app-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .app-icon {
            width: 60px; height: 60px;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 24px;
        }
        
        .app-title { font-size: 18px; font-weight: 600; }
        .app-rating { color: #FFD700; font-size: 14px; margin-top: 5px; }
        .app-desc-short { color: var(--text-muted); font-size: 14px; line-height: 1.5; margin-bottom: 15px;}
        
        .btn-view {
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: 0.3s;
        }
        .app-card:hover .btn-view { background: var(--primary-accent); color: #000; }

        /* App Details Screen */
        .back-btn {
            background: none; border: none; color: var(--primary-accent);
            font-size: 16px; cursor: pointer; margin-bottom: 20px;
            display: flex; align-items: center; gap: 5px; font-weight: 600;
        }

        .details-header { display: flex; gap: 30px; align-items: center; flex-wrap: wrap; margin-bottom: 40px; }
        .details-icon {
            width: 120px; height: 120px; border-radius: 25px;
            background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
            display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: bold;
        }
        
        .details-info h1 { font-size: 32px; margin-bottom: 10px; }
        .btn-download {
            background: var(--primary-accent); color: #000;
            padding: 15px 40px; border-radius: 30px; border: none;
            font-size: 18px; font-weight: 700; cursor: pointer;
            margin-top: 15px; display: inline-block; text-decoration: none;
            transition: 0.3s;
        }
        .btn-download:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 230, 118, 0.4); }

        .screenshots-container {
            display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px;
            scrollbar-width: thin; scrollbar-color: var(--primary-accent) var(--card-bg);
        }
        .screenshots-container::-webkit-scrollbar { height: 8px; }
        .screenshots-container::-webkit-scrollbar-thumb { background: var(--primary-accent); border-radius: 10px; }
        
        .screenshot {
            min-width: 250px; height: 450px; border-radius: 15px;
            background: var(--card-bg); object-fit: cover;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .features-list { margin-top: 40px; }
        .features-list h3 { margin-bottom: 15px; font-size: 22px; color: var(--primary-accent); }
        .features-list ul { list-style-position: inside; color: var(--text-muted); line-height: 1.8; }

        /* Responsive */
        @media (max-width: 768px) {
            nav { flex-direction: column; gap: 15px; }
            .search-bar { width: 100%; }
            .hero h1 { font-size: 28px; }
            .details-header { flex-direction: column; text-align: center; }
            .screenshot { min-width: 200px; height: 380px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><span>SJI</span> App Store</div>
        <input type="text" class="search-bar" placeholder="Search apps...">
    </nav>

    <!-- HOME SCREEN (APP LIST) -->
    <main id="home-view" class="view-section active">
        <div class="hero">
            <h1>Discover Swipe Jobs India Solutions</h1>
            <p>Empowering companies, teams, and candidates with next-gen platforms.</p>
        </div>

        <div class="app-grid" id="app-grid">
            <!-- Cards will be injected via JS -->
        </div>
    </main>

    <!-- APP DETAILS SCREEN -->
    <section id="details-view" class="view-section">
        <button class="back-btn" onclick="showHome()">← Back to Apps</button>
        
        <div class="details-header">
            <div class="details-icon" id="detail-icon">SJI</div>
            <div class="details-info">
                <h1 id="detail-title">App Title</h1>
                <div class="app-rating">★★★★★ 4.9 • Official App</div>
                <p id="detail-desc" style="color: var(--text-muted); max-width: 600px; margin-top: 10px;"></p>
                <a id="detail-download" href="#" class="btn-download">Download APK</a>
            </div>
        </div>

        <div class="features-list">
            <h3>Screenshots</h3>
            <div class="screenshots-container" id="detail-screenshots">
                <!-- Screenshots injected here -->
            </div>
            
            <h3 style="margin-top: 40px;">About this app</h3>
            <ul id="detail-features">
                <!-- Features injected here -->
            </ul>
        </div>
    </section>

    <script>
        // Data for the 3 Applications
        const appsData = [
            {
                id: 1,
                name: "SJI Partner Team",
                shortDesc: "For internal team management, attendance, and salary details.",
                iconText: "PT",
                apkLink: "https://github.com/anandSP999/Swipe-job-India-App/releases/download/v1.0/SJI.Partner.Team.apk",
                fullDesc: "Designed specifically for companies partnering with Swipe Jobs India. It allows management to seamlessly handle their employees' daily tasks.",
                features: [
                    "Assign work efficiently to team members",
                    "Track daily attendance and working hours",
                    "Manage salary details and payrolls",
                    "Generate and manage offer letters",
                    "Handle job leaves and job ending processes"
                ],
                // Yahan aap apne GitHub raw image links daal sakte hain
                screenshots: [
                    "https://placehold.co/250x450/112240/00E676?text=Team+Screen+1",
                    "https://placehold.co/250x450/112240/00E676?text=Team+Screen+2"
                ]
            },
            {
                id: 2,
                name: "Swipe Job India Partner",
                shortDesc: "Recruitment portal for companies and agencies to post jobs.",
                iconText: "JP",
                apkLink: "https://github.com/anandSP999/Swipe-job-India-App/releases/download/v1.0/Swipe.Job.India.Partner.apk",
                fullDesc: "The ultimate tool for hiring companies and recruitment agencies. Manage your hiring pipeline and teams effectively.",
                features: [
                    "Post new job requirements instantly",
                    "Dedicated plans for recruitment agencies",
                    "Manage multiple candidates easily",
                    "Team member management capabilities"
                ],
                // Aapke GitHub link 2 ke images ke raw URLs yahan aayenge:
                screenshots: [
                    "https://placehold.co/250x450/112240/0066FF?text=Partner+App+1",
                    "https://placehold.co/250x450/112240/0066FF?text=Partner+App+2",
                    "https://placehold.co/250x450/112240/0066FF?text=Partner+App+3"
                ]
            },
            {
                id: 3,
                name: "Swipe Jobs India",
                shortDesc: "For candidates to find jobs, apply, and earn through referrals.",
                iconText: "SJI",
                apkLink: "https://github.com/anandSP999/Swipe-job-India-App/releases/download/v1.0/SwipeJobsIndia.apk",
                fullDesc: "The core platform for job seekers. Create your profile, browse available job posts, and secure your future career.",
                features: [
                    "Create and manage professional candidate profiles",
                    "View and apply to the latest job postings",
                    "Refer and Earn: Make money by referring friends to jobs",
                    "Real-time application status tracking"
                ],
                // Aapke GitHub link 3 ke images ke raw URLs yahan aayenge:
                screenshots: [
                    "https://placehold.co/250x450/112240/E6F1FF?text=Candidate+App+1",
                    "https://placehold.co/250x450/112240/E6F1FF?text=Candidate+App+2",
                    "https://placehold.co/250x450/112240/E6F1FF?text=Candidate+App+3"
                ]
            }
        ];

        // Render Home Page App Cards
        const appGrid = document.getElementById('app-grid');
        
        appsData.forEach(app => {
            const card = document.createElement('div');
            card.className = 'app-card';
            card.onclick = () => showDetails(app.id);
            card.innerHTML = `
                <div class="app-header">
                    <div class="app-icon">${app.iconText}</div>
                    <div>
                        <div class="app-title">${app.name}</div>
                        <div class="app-rating">★★★★★ 4.8</div>
                    </div>
                </div>
                <p class="app-desc-short">${app.shortDesc}</p>
                <button class="btn-view">View Details</button>
            `;
            appGrid.appendChild(card);
        });

        // Navigation Functions
        function showDetails(appId) {
            const app = appsData.find(a => a.id === appId);
            
            document.getElementById('detail-title').innerText = app.name;
            document.getElementById('detail-icon').innerText = app.iconText;
            document.getElementById('detail-desc').innerText = app.fullDesc;
            document.getElementById('detail-download').href = app.apkLink;
            
            // Render Features
            const featuresList = document.getElementById('detail-features');
            featuresList.innerHTML = '';
            app.features.forEach(f => {
                featuresList.innerHTML += `<li>${f}</li>`;
            });

            // Render Screenshots
            const screenshotsContainer = document.getElementById('detail-screenshots');
            screenshotsContainer.innerHTML = '';
            app.screenshots.forEach(src => {
                screenshotsContainer.innerHTML += `<img src="${src}" class="screenshot" alt="Screenshot">`;
            });

            document.getElementById('home-view').classList.remove('active');
            window.scrollTo(0, 0);
            document.getElementById('details-view').classList.add('active');
        }

        function showHome() {
            document.getElementById('details-view').classList.remove('active');
            document.getElementById('home-view').classList.add('active');
        }
    </script>
</body>
</html>
